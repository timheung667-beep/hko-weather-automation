name: Daily HKO Weather Forecast

on:
  schedule:
    # Runs at minute 15 of every hour (24 times a day)
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual triggers anytime
  
jobs:
  run-weather-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run Weather Script
        run: python weather.py
