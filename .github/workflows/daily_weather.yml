name: Hourly HKO Weather Forecast

on:
  schedule:
    - cron: '15 * * * *'  # Runs every hour at minute 15
  workflow_dispatch:      # Allows manual trigger button in Actions tab

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weather script
        run: python weather.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md today.json
          git commit -m "Auto-update weather data [skip ci]" || exit 0
          git push
